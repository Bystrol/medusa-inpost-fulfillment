name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --omit=peer --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
